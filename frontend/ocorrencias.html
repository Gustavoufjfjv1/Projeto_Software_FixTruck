<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrências — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Ocorrências</h1>
        <p>Histórico filtrável e gerenciamento de ocorrências da frota</p>
    </div>
    <div style="display:flex;gap:10px">
        <a href="ocorrencias.html?status=abertas" class="btn btn-outline">Em aberto</a>
        <a href="ocorrencias.html?status=resolvido" class="btn btn-outline">Encerradas</a>
        <a href="nova_ocorrencia.html" class="btn btn-primary">+ Nova Ocorrência</a>
    </div>
</div>

<div class="card">
    <form id="filtrosForm">
        <div class="filters-bar">
            <select name="periodo" id="filtro_periodo" class="filter-select">
                <option value="">Todo período</option>
                <option value="7d">Últimos 7 dias</option>
                <option value="30d">Últimos 30 dias</option>
                <option value="90d">Últimos 90 dias</option>
            </select>
            <select name="tipo" id="filtro_tipo" class="filter-select">
                <option value="">Tipo de problema</option>
                <option value="mecânica">Mecânica</option>
                <option value="elétrica">Elétrica</option>
                <option value="hidráulica">Hidráulica</option>
                <option value="borracharia">Borracharia</option>
                <option value="não identificado">Não identificado</option>
            </select>
            <select name="veiculo" id="filtro_veiculo" class="filter-select">
                <option value="">Veículo da frota</option>
            </select>
            <select name="status" id="filtro_status" class="filter-select">
                <option value="">Todos status</option>
                <option value="abertas">Em aberto</option>
                <option value="aberta">Aberta</option>
                <option value="em_atendimento">Em Atendimento</option>
                <option value="resolvido">Resolvido</option>
            </select>
            <a href="ocorrencias.html" id="btn-limpar" class="btn btn-outline btn-sm" style="display:none">✕ Limpar</a>
        </div>
    </form>
    <div id="lista-container"></div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

const periodo = qs('periodo') || '';
const tipo = qs('tipo') || '';
const veiculo = qs('veiculo') || '';
const status = qs('status') || '';

document.getElementById('filtro_periodo').value = periodo;
document.getElementById('filtro_tipo').value = tipo;
document.getElementById('filtro_status').value = status;

if (periodo || tipo || veiculo || status) {
    document.getElementById('btn-limpar').style.display = '';
}

function applyFilters() {
    const params = new URLSearchParams();
    const p = document.getElementById('filtro_periodo').value;
    const t = document.getElementById('filtro_tipo').value;
    const v = document.getElementById('filtro_veiculo').value;
    const s = document.getElementById('filtro_status').value;
    if (p) params.set('periodo', p);
    if (t) params.set('tipo', t);
    if (v) params.set('veiculo', v);
    if (s) params.set('status', s);
    const q = params.toString();
    window.location.href = 'ocorrencias.html' + (q ? '?' + q : '');
}

['filtro_periodo', 'filtro_tipo', 'filtro_veiculo', 'filtro_status'].forEach(id => {
    document.getElementById(id).addEventListener('change', applyFilters);
});

async function atualizarStatus(id, novoStatus) {
    try {
        const data = await Api.patch(`/api/ocorrencias/${id}/status`, { status: novoStatus });
        showFlash(data.mensagem || 'Status atualizado.', 'success');
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

async function load() {
    const params = new URLSearchParams();
    if (periodo) params.set('periodo', periodo);
    if (tipo) params.set('tipo', tipo);
    if (veiculo) params.set('veiculo', veiculo);
    if (status) params.set('status', status);
    const q = params.toString();

    try {
        const data = await Api.get('/api/ocorrencias' + (q ? '?' + q : ''));
        const veiculos = data.veiculos || [];
        const selectV = document.getElementById('filtro_veiculo');
        selectV.innerHTML = '<option value="">Veículo da frota</option>' +
            veiculos.map(v => `<option value="${v.id}" ${String(veiculo) === String(v.id) ? 'selected' : ''}>${v.placa}${v.modelo ? ' — ' + v.modelo : ''}</option>`).join('');

        const ocorrencias = data.ocorrencias || [];
        const container = document.getElementById('lista-container');

        if (!ocorrencias.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3>Nenhuma ocorrência encontrada</h3>
                    <p>Tente outros filtros ou registre uma nova ocorrência.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Veículo</th>
                            <th>Motorista</th>
                            <th>Problema</th>
                            <th>Local (GPS)</th>
                            <th>Status</th>
                            <th>Abertura</th>
                            <th>Encerramento</th>
                            <th>Oficina</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    ${ocorrencias.map(oc => {
                        let local = '—';
                        if (oc.lat && oc.lon) {
                            local = `${String(oc.lat).slice(0, 8)}, ${String(oc.lon).slice(0, 8)}`;
                        } else if (oc.endereco) {
                            local = oc.endereco;
                        }
                        let acoes = `<a href="detalhe_ocorrencia.html?id=${oc.id}" class="btn btn-outline btn-sm">Ver</a>`;
                        if (oc.status === 'aberta') {
                            acoes += ` <button type="button" class="btn btn-outline btn-sm" data-atend="${oc.id}">Em atend.</button>`;
                            acoes += ` <a href="buscar_oficinas.html?id=${oc.id}" class="btn btn-outline btn-sm">Oficinas</a>`;
                        } else if (oc.status === 'em_atendimento') {
                            acoes += ` <a href="encerrar_ocorrencia.html?id=${oc.id}" class="btn btn-primary btn-sm">Encerrar</a>`;
                        }
                        return `
                        <tr>
                            <td style="font-weight:700;color:var(--gray-400)">#${oc.id}</td>
                            <td>
                                <span class="badge badge-gray">${oc.veiculo_placa || oc.tipo_veiculo || '—'}</span>
                                ${oc.pane_total ? '<span class="badge badge-red" style="margin-left:4px">pane total</span>' : ''}
                            </td>
                            <td style="font-size:13px">${oc.motorista_nome || '—'}</td>
                            <td style="text-transform:capitalize">${oc.tipo_problema || '—'}</td>
                            <td style="font-size:13px;color:var(--gray-600);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${local}</td>
                            <td>${statusBadge(oc.status)}</td>
                            <td style="font-size:13px;color:var(--gray-600)">${formatDate(oc.data_abertura)}</td>
                            <td style="font-size:13px;color:var(--gray-600)">${formatDate(oc.data_encerramento)}</td>
                            <td style="font-size:13px">${oc.oficina_nome || '—'}</td>
                            <td>
                                <div style="display:flex;gap:6px;flex-wrap:wrap">${acoes}</div>
                            </td>
                        </tr>`;
                    }).join('')}
                    </tbody>
                </table>
            </div>
        `;

        container.querySelectorAll('[data-atend]').forEach(btn => {
            btn.addEventListener('click', () => atualizarStatus(btn.dataset.atend, 'em_atendimento'));
        });
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

load();
</script>
</body>
</html>
