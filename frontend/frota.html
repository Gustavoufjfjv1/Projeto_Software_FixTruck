<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frota — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Frota</h1>
        <p>Cadastre veículos e vincule motoristas específicos a cada um</p>
    </div>
</div>

<div class="grid-2" style="margin-bottom:24px">
    <div class="card">
        <div class="card-header"><span class="card-title">Novo motorista</span></div>
        <form id="formMotorista">
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" name="nome" id="mot_nome" required placeholder="Nome completo">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>CNH</label>
                    <input type="text" name="cnh" id="mot_cnh" inputmode="numeric" maxlength="11" placeholder="00000000000" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" name="telefone" id="mot_telefone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Cadastrar motorista</button>
        </form>
    </div>

    <div class="card">
        <div class="card-header"><span class="card-title">Novo veículo</span></div>
        <form id="formVeiculo">
            <div class="form-row">
                <div class="form-group">
                    <label>Placa *</label>
                    <input type="text" name="placa" id="vei_placa" required placeholder="ABC1D23" maxlength="7" autocomplete="off" style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <label>Tipo *</label>
                    <select name="tipo_veiculo" id="vei_tipo" required>
                        <option value="leve">Leve</option>
                        <option value="médio">Médio</option>
                        <option value="pesado" selected>Pesado</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" name="marca" id="vei_marca" placeholder="Mercedes, Volvo...">
                </div>
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text" name="modelo" id="vei_modelo" placeholder="Actros 2651">
                </div>
            </div>
            <div class="form-group">
                <label>Vincular motorista</label>
                <select name="motorista_id" id="vei_motorista">
                    <option value="">Sem motorista</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Cadastrar veículo</button>
        </form>
    </div>
</div>

<div class="card" style="margin-bottom:20px">
    <div class="card-header"><span class="card-title">Veículos da frota</span></div>
    <div id="veiculos-container"></div>
</div>

<div class="card">
    <div class="card-header"><span class="card-title">Motoristas</span></div>
    <form id="buscarMotoristaForm" class="filters-bar" style="padding:0 20px 16px;margin-bottom:0">
        <input type="search" id="buscarMotorista" class="filter-select"
               placeholder="Buscar por nome, CNH ou telefone" style="min-width:260px">
        <button type="submit" class="btn btn-outline btn-sm">Buscar motorista</button>
        <button type="button" id="limparBuscaMotorista" class="btn btn-outline btn-sm">Limpar</button>
    </form>
    <div id="motoristas-container"></div>
</div>

<dialog id="editarMotoristaDialog">
    <form id="editarMotoristaForm" style="min-width:min(420px, 85vw);padding:24px">
        <h2 style="margin-bottom:18px">Editar motorista</h2>
        <input type="hidden" id="editarMotoristaId">
        <div class="form-group">
            <label for="editarMotoristaNome">Nome *</label>
            <input id="editarMotoristaNome" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="editarMotoristaCnh">CNH</label>
                <input id="editarMotoristaCnh" inputmode="numeric" maxlength="11">
            </div>
            <div class="form-group">
                <label for="editarMotoristaTelefone">Telefone</label>
                <input id="editarMotoristaTelefone" inputmode="tel" maxlength="15">
            </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button type="button" class="btn btn-outline" data-fechar-dialog>Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
    </form>
</dialog>

<dialog id="editarVeiculoDialog">
    <form id="editarVeiculoForm" style="min-width:min(480px, 85vw);padding:24px">
        <h2 style="margin-bottom:18px">Editar veículo</h2>
        <input type="hidden" id="editarVeiculoId">
        <div class="form-row">
            <div class="form-group">
                <label for="editarVeiculoPlaca">Placa *</label>
                <input id="editarVeiculoPlaca" required maxlength="7" style="text-transform:uppercase">
            </div>
            <div class="form-group">
                <label for="editarVeiculoTipo">Tipo *</label>
                <select id="editarVeiculoTipo" required>
                    <option value="leve">Leve</option>
                    <option value="médio">Médio</option>
                    <option value="pesado">Pesado</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="editarVeiculoMarca">Marca</label>
                <input id="editarVeiculoMarca">
            </div>
            <div class="form-group">
                <label for="editarVeiculoModelo">Modelo</label>
                <input id="editarVeiculoModelo">
            </div>
        </div>
        <div class="form-group">
            <label for="editarVeiculoMotorista">Motorista</label>
            <select id="editarVeiculoMotorista"></select>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button type="button" class="btn btn-outline" data-fechar-dialog>Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
    </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/masks.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('frota');

Masks.bind(document.getElementById('mot_cnh'), 'cnh');
Masks.bind(document.getElementById('mot_telefone'), 'telefone');
Masks.bind(document.getElementById('vei_placa'), 'placa');

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);
}

function optionsMotoristas(motoristas, selectedId) {
    return '<option value="">Sem motorista</option>' +
        motoristas.map(m =>
            `<option value="${m.id}" ${String(selectedId) === String(m.id) ? 'selected' : ''}>${escapeHtml(m.nome)}</option>`
        ).join('');
}

function motoristaAtivo(motorista) {
    return Number(motorista.ativo) !== 0;
}

let motoristasAtuais = [];
let veiculosAtuais = [];
let handlersBound = false;

async function load(termo = '') {
    try {
        const data = await Api.get('/api/frota');
        veiculosAtuais = data.veiculos || [];
        motoristasAtuais = data.motoristas || [];
        const motoristas = termo
            ? (await Api.get(`/api/frota/motoristas?busca=${encodeURIComponent(termo)}`)).motoristas
            : motoristasAtuais;
        const motoristasAtivos = motoristasAtuais.filter(motoristaAtivo);

        document.getElementById('vei_motorista').innerHTML = optionsMotoristas(motoristasAtivos);

        const veiEl = document.getElementById('veiculos-container');
        if (veiculosAtuais.length) {
            veiEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Tipo</th>
                                <th>Motorista vinculado</th>
                                <th>Vincular / alterar</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${veiculosAtuais.map(v => `
                            <tr>
                                <td style="font-weight:700">${escapeHtml(v.placa)}</td>
                                <td>${escapeHtml([v.marca, v.modelo].filter(Boolean).join(' ') || '—')}</td>
                                <td><span class="badge badge-gray" style="text-transform:capitalize">${escapeHtml(v.tipo_veiculo || '—')}</span></td>
                                <td>${escapeHtml(v.motorista_nome || '—')}</td>
                                <td>
                                    <form class="vincular-form" data-veiculo="${v.id}" style="display:flex;gap:8px;align-items:center">
                                        <select name="motorista_id" class="filter-select">
                                            ${optionsMotoristas(motoristasAtivos, v.motorista_id)}
                                        </select>
                                        <button type="submit" class="btn btn-primary btn-sm">Vincular</button>
                                    </form>
                                </td>
                                <td style="display:flex;gap:6px">
                                    <button type="button" class="btn btn-outline btn-sm editar-veiculo" data-id="${v.id}">Editar</button>
                                    <button type="button" class="btn btn-outline btn-sm excluir-veiculo" data-id="${v.id}">Excluir</button>
                                </td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            veiEl.querySelectorAll('.vincular-form').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const veiculoId = form.dataset.veiculo;
                    const motoristaId = form.querySelector('select').value;
                    try {
                        const res = await Api.post(`/api/frota/veiculos/${veiculoId}/vincular`, {
                            motorista_id: motoristaId ? Number(motoristaId) : null,
                        });
                        showFlash(res.mensagem || 'Motorista vinculado.', 'success');
                        load();
                    } catch (err) {
                        showFlash(err.message, 'error');
                    }
                });
            });
        } else {
            veiEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.truck(48)}</div>
                    <h3>Nenhum veículo cadastrado</h3>
                    <p>Cadastre o primeiro veículo da frota ao lado.</p>
                </div>
            `;
        }

        const motEl = document.getElementById('motoristas-container');
        if (motoristas.length) {
            motEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CNH</th>
                                <th>Telefone</th>
                                <th>Veículo</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${motoristas.map(m => `
                            <tr>
                                <td style="font-weight:600">${escapeHtml(m.nome)}</td>
                                <td>${escapeHtml(m.cnh || '—')}</td>
                                <td>${escapeHtml(m.telefone || '—')}</td>
                                <td>${escapeHtml(m.veiculo_placa || '—')}</td>
                                <td>${motoristaAtivo(m) ? 'Ativo' : 'Inativo'}</td>
                                <td style="display:flex;gap:6px;flex-wrap:wrap">
                                    <button type="button" class="btn btn-outline btn-sm editar-motorista" data-id="${m.id}">Editar</button>
                                    <button type="button" class="btn btn-outline btn-sm alternar-motorista" data-id="${m.id}" data-acao="${motoristaAtivo(m) ? 'inativar' : 'reativar'}">${motoristaAtivo(m) ? 'Inativar' : 'Reativar'}</button>
                                    <button type="button" class="btn btn-outline btn-sm excluir-motorista" data-id="${m.id}">Excluir</button>
                                </td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } else {
            motEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.user(48)}</div>
                    <h3>Nenhum motorista cadastrado</h3>
                </div>
            `;
        }

        if (!handlersBound) {
            handlersBound = true;
            document.getElementById('buscarMotoristaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const termo = document.getElementById('buscarMotorista').value.trim();
            if (termo.length < 2) {
                showFlash('Informe pelo menos 2 caracteres para pesquisar.', 'error');
                return;
            }
            load(termo);
        });

        document.getElementById('limparBuscaMotorista').addEventListener('click', () => {
            document.getElementById('buscarMotorista').value = '';
            load();
        });

        document.querySelectorAll('[data-fechar-dialog]').forEach(button => {
            button.addEventListener('click', () => button.closest('dialog').close());
        });

        document.getElementById('motoristas-container').addEventListener('click', async (event) => {
            const button = event.target.closest('button');
            if (!button) return;
            const motoristaId = Number(button.dataset.id);
            const motorista = motoristasAtuais.find(item => item.id === motoristaId);
            if (!motorista) return;

            if (button.classList.contains('editar-motorista')) {
                document.getElementById('editarMotoristaId').value = motorista.id;
                document.getElementById('editarMotoristaNome').value = motorista.nome || '';
                document.getElementById('editarMotoristaCnh').value = motorista.cnh || '';
                document.getElementById('editarMotoristaTelefone').value = motorista.telefone || '';
                document.getElementById('editarMotoristaDialog').showModal();
            } else if (button.classList.contains('alternar-motorista')) {
                const acao = button.dataset.acao;
                try {
                    const res = await Api.patch(`/api/frota/motoristas/${motoristaId}/${acao}`, {});
                    showFlash(res.mensagem, 'success');
                    load(document.getElementById('buscarMotorista').value.trim());
                } catch (err) {
                    showFlash(err.message, 'error');
                }
            } else if (button.classList.contains('excluir-motorista')) {
                if (!window.confirm(`Excluir o cadastro de ${motorista.nome}?`)) return;
                try {
                    const res = await Api.request(`/api/frota/motoristas/${motoristaId}`, { method: 'DELETE' });
                    showFlash(res.mensagem, 'success');
                    load(document.getElementById('buscarMotorista').value.trim());
                } catch (err) {
                    showFlash(err.message, 'error');
                }
            }
        });

        document.getElementById('veiculos-container').addEventListener('click', async (event) => {
            const button = event.target.closest('button');
            if (!button) return;
            const veiculoId = Number(button.dataset.id);
            const veiculo = veiculosAtuais.find(item => item.id === veiculoId);
            if (!veiculo) return;

            if (button.classList.contains('editar-veiculo')) {
                document.getElementById('editarVeiculoId').value = veiculo.id;
                document.getElementById('editarVeiculoPlaca').value = veiculo.placa || '';
                document.getElementById('editarVeiculoTipo').value = veiculo.tipo_veiculo || 'pesado';
                document.getElementById('editarVeiculoMarca').value = veiculo.marca || '';
                document.getElementById('editarVeiculoModelo').value = veiculo.modelo || '';
                document.getElementById('editarVeiculoMotorista').innerHTML =
                    optionsMotoristas(motoristasAtuais.filter(motoristaAtivo), veiculo.motorista_id);
                document.getElementById('editarVeiculoDialog').showModal();
            } else if (button.classList.contains('excluir-veiculo')) {
                if (!window.confirm(`Excluir o veículo ${veiculo.placa}?`)) return;
                try {
                    const res = await Api.request(`/api/frota/veiculos/${veiculoId}`, { method: 'DELETE' });
                    showFlash(res.mensagem, 'success');
                    load(document.getElementById('buscarMotorista').value.trim());
                } catch (err) {
                    showFlash(err.message, 'error');
                }
            }
        });

        document.getElementById('editarMotoristaForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const motoristaId = document.getElementById('editarMotoristaId').value;
            try {
                const res = await Api.put(`/api/frota/motoristas/${motoristaId}`, {
                    nome: document.getElementById('editarMotoristaNome').value,
                    cnh: document.getElementById('editarMotoristaCnh').value,
                    telefone: document.getElementById('editarMotoristaTelefone').value,
                });
                document.getElementById('editarMotoristaDialog').close();
                showFlash(res.mensagem, 'success');
                load(document.getElementById('buscarMotorista').value.trim());
            } catch (err) {
                showFlash(err.message, 'error');
            }
        });

            document.getElementById('editarVeiculoForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const veiculoId = document.getElementById('editarVeiculoId').value;
            const motoristaId = document.getElementById('editarVeiculoMotorista').value;
            try {
                const res = await Api.put(`/api/frota/veiculos/${veiculoId}`, {
                    placa: document.getElementById('editarVeiculoPlaca').value,
                    tipo_veiculo: document.getElementById('editarVeiculoTipo').value,
                    marca: document.getElementById('editarVeiculoMarca').value,
                    modelo: document.getElementById('editarVeiculoModelo').value,
                    motorista_id: motoristaId ? Number(motoristaId) : null,
                });
                document.getElementById('editarVeiculoDialog').close();
                showFlash(res.mensagem, 'success');
                load(document.getElementById('buscarMotorista').value.trim());
            } catch (err) {
                showFlash(err.message, 'error');
            }
            });
        }
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

document.getElementById('formMotorista').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await Api.post('/api/frota/motoristas', {
            nome: document.getElementById('mot_nome').value,
            cnh: document.getElementById('mot_cnh').value,
            telefone: document.getElementById('mot_telefone').value,
        });
        showFlash(res.mensagem || 'Motorista cadastrado.', 'success');
        e.target.reset();
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
});

document.getElementById('formVeiculo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mid = document.getElementById('vei_motorista').value;
    try {
        const res = await Api.post('/api/frota/veiculos', {
            placa: document.getElementById('vei_placa').value,
            modelo: document.getElementById('vei_modelo').value,
            marca: document.getElementById('vei_marca').value,
            tipo_veiculo: document.getElementById('vei_tipo').value,
            motorista_id: mid ? Number(mid) : null,
        });
        showFlash(res.mensagem || 'Veículo cadastrado.', 'success');
        e.target.reset();
        document.getElementById('vei_tipo').value = 'pesado';
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
});

load();
</script>
</body>
</html>
