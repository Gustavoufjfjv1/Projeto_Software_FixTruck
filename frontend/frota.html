<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frota — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Frota</h1>
        <p>Cadastre veículos e vincule motoristas específicos a cada um</p>
    </div>
</div>

<div class="grid-2" style="margin-bottom:24px">
    <div class="card">
        <div class="card-header"><span class="card-title">Novo motorista</span></div>
        <form id="formMotorista">
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" name="nome" id="mot_nome" required placeholder="Nome completo">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>CNH</label>
                    <input type="text" name="cnh" id="mot_cnh" inputmode="numeric" maxlength="11" placeholder="00000000000" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" name="telefone" id="mot_telefone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel">
                </div>
            </div>
            <div class="form-group">
                <label>E-mail de acesso (opcional)</label>
                <input type="email" name="email" id="mot_email" maxlength="120" placeholder="motorista@transportadora.com" autocomplete="off">
                <small style="color:var(--gray-500)">Com e-mail, o motorista recebe uma senha provisória para entrar no app e registrar ocorrências.</small>
            </div>
            <div id="senha-gerada"></div>
            <button type="submit" class="btn btn-primary btn-sm">Cadastrar motorista</button>
        </form>
    </div>

    <div class="card">
        <div class="card-header"><span class="card-title">Novo veículo</span></div>
        <form id="formVeiculo">
            <div class="form-row">
                <div class="form-group">
                    <label>Placa *</label>
                    <input type="text" name="placa" id="vei_placa" required placeholder="ABC1D23 ou ABC1234" title="Mercosul (ABC1D23) ou antiga (ABC-1234)" maxlength="8" autocomplete="off" style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <label>Tipo *</label>
                    <select name="tipo_veiculo" id="vei_tipo" required>
                        <option value="leve">Leve</option>
                        <option value="médio">Médio</option>
                        <option value="pesado" selected>Pesado</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" name="marca" id="vei_marca" placeholder="Mercedes, Volvo...">
                </div>
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text" name="modelo" id="vei_modelo" placeholder="Actros 2651">
                </div>
            </div>
            <div class="form-group">
                <label>Vincular motorista</label>
                <select name="motorista_id" id="vei_motorista">
                    <option value="">Sem motorista</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Cadastrar veículo</button>
        </form>
    </div>
</div>

<div class="card" style="margin-bottom:20px">
    <div class="card-header"><span class="card-title">Veículos da frota</span></div>
    <div id="veiculos-container"></div>
</div>

<div class="card">
    <div class="card-header"><span class="card-title">Motoristas</span></div>
    <div id="motoristas-container"></div>
</div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/masks.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('frota');

Masks.bind(document.getElementById('mot_cnh'), 'cnh');
Masks.bind(document.getElementById('mot_telefone'), 'telefone');
Masks.bind(document.getElementById('vei_placa'), 'placa');

function optionsMotoristas(motoristas, selectedId) {
    return '<option value="">Sem motorista</option>' +
        motoristas.map(m =>
            `<option value="${m.id}" ${String(selectedId) === String(m.id) ? 'selected' : ''}>${esc(m.nome)}</option>`
        ).join('');
}

async function load() {
    try {
        const data = await Api.get('/api/frota');
        const veiculos = data.veiculos || [];
        const motoristas = data.motoristas || [];

        document.getElementById('vei_motorista').innerHTML = optionsMotoristas(motoristas);

        const veiEl = document.getElementById('veiculos-container');
        if (veiculos.length) {
            veiEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Tipo</th>
                                <th>Motorista vinculado</th>
                                <th>Vincular / alterar</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${veiculos.map(v => `
                            <tr>
                                <td style="font-weight:700">${esc(v.placa)}</td>
                                <td>${(v.marca || '') + ' ' + (v.modelo || '—')}</td>
                                <td><span class="badge badge-gray" style="text-transform:capitalize">${v.tipo_veiculo || '—'}</span></td>
                                <td>${esc(v.motorista_nome || '—')}</td>
                                <td>
                                    <form class="vincular-form" data-veiculo="${v.id}" style="display:flex;gap:8px;align-items:center">
                                        <select name="motorista_id" class="filter-select">
                                            ${optionsMotoristas(motoristas, v.motorista_id)}
                                        </select>
                                        <button type="submit" class="btn btn-primary btn-sm">Vincular</button>
                                    </form>
                                </td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            veiEl.querySelectorAll('.vincular-form').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const veiculoId = form.dataset.veiculo;
                    const motoristaId = form.querySelector('select').value;
                    try {
                        const res = await Api.post(`/api/frota/veiculos/${veiculoId}/vincular`, {
                            motorista_id: motoristaId ? Number(motoristaId) : null,
                        });
                        showFlash(res.mensagem || 'Motorista vinculado.', 'success');
                        load();
                    } catch (err) {
                        showFlash(err.message, 'error');
                    }
                });
            });
        } else {
            veiEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.truck(48)}</div>
                    <h3>Nenhum veículo cadastrado</h3>
                    <p>Cadastre o primeiro veículo da frota ao lado.</p>
                </div>
            `;
        }

        const motEl = document.getElementById('motoristas-container');
        if (motoristas.length) {
            motEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CNH</th>
                                <th>Telefone</th>
                                <th>Veículo</th>
                                <th>Acesso ao app</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${motoristas.map(m => `
                            <tr>
                                <td style="font-weight:600">${esc(m.nome)}</td>
                                <td>${esc(m.cnh || '—')}</td>
                                <td>${esc(m.telefone || '—')}</td>
                                <td>${esc(m.veiculo_placa || '—')}</td>
                                <td>
                                    ${m.tem_acesso
                                        ? `<span class="badge badge-green">${esc(m.email)}</span>${m.trocar_senha ? ' <span class="badge badge-orange">troca de senha pendente</span>' : ''}`
                                        : '<span class="badge badge-gray">sem acesso</span>'}
                                    <form class="acesso-form" data-motorista="${m.id}" style="display:flex;gap:6px;margin-top:6px">
                                        <input type="email" class="filter-select" placeholder="e-mail" value="${esc(m.email || '')}" required maxlength="120" style="min-width:160px">
                                        <button type="submit" class="btn btn-outline btn-sm">${m.tem_acesso ? 'Nova senha' : 'Dar acesso'}</button>
                                    </form>
                                </td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            motEl.querySelectorAll('.acesso-form').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    try {
                        const res = await Api.post(`/api/frota/motoristas/${form.dataset.motorista}/acesso`, {
                            email: form.querySelector('input').value,
                        });
                        mostrarSenha(res);
                        load();
                    } catch (err) {
                        showFlash(err.message, 'error');
                    }
                });
            });
        } else {
            motEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.user(48)}</div>
                    <h3>Nenhum motorista cadastrado</h3>
                </div>
            `;
        }
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

function mostrarSenha(res) {
    showFlash(res.mensagem, 'success');
    if (!res.senha_temporaria) return;
    document.getElementById('senha-gerada').innerHTML = `
        <div class="alert alert-info">
            Acesso de <strong>${esc(res.email)}</strong> — senha provisória: <strong style="font-family:monospace;font-size:16px">${esc(res.senha_temporaria)}</strong><br>
            Anote e entregue ao motorista; ela não será exibida de novo. Ele deve trocá-la no primeiro login em <em>motorista_login.html</em>.
        </div>`;
    document.getElementById('senha-gerada').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('formMotorista').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await Api.post('/api/frota/motoristas', {
            nome: document.getElementById('mot_nome').value,
            cnh: document.getElementById('mot_cnh').value,
            telefone: document.getElementById('mot_telefone').value,
            email: document.getElementById('mot_email').value,
        });
        mostrarSenha(res);
        e.target.reset();
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
});

document.getElementById('formVeiculo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mid = document.getElementById('vei_motorista').value;
    try {
        const res = await Api.post('/api/frota/veiculos', {
            placa: document.getElementById('vei_placa').value,
            modelo: document.getElementById('vei_modelo').value,
            marca: document.getElementById('vei_marca').value,
            tipo_veiculo: document.getElementById('vei_tipo').value,
            motorista_id: mid ? Number(mid) : null,
        });
        showFlash(res.mensagem || 'Veículo cadastrado.', 'success');
        e.target.reset();
        document.getElementById('vei_tipo').value = 'pesado';
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
});

load();
</script>
</body>
</html>
