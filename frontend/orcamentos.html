<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Orçamentos</h1>
        <p>Aprove ou rejeite digitalmente orçamentos enviados pelas oficinas</p>
    </div>
</div>

<div class="card">
    <div class="filters-bar">
        <select name="status" id="filtro_status" class="filter-select">
            <option value="">Todos</option>
            <option value="pendente">Pendentes</option>
            <option value="aprovado">Aprovados</option>
            <option value="rejeitado">Rejeitados</option>
        </select>
        <a href="orcamentos.html" id="btn-limpar" class="btn btn-outline btn-sm" style="display:none"><span data-icon="x" data-size="16"></span> Limpar</a>
    </div>
    <div id="lista-container"></div>
</div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('orcamentos');

const filtroStatus = qs('status') || '';
document.getElementById('filtro_status').value = filtroStatus;
if (filtroStatus) document.getElementById('btn-limpar').style.display = '';

document.getElementById('filtro_status').addEventListener('change', () => {
    const s = document.getElementById('filtro_status').value;
    window.location.href = 'orcamentos.html' + (s ? '?status=' + encodeURIComponent(s) : '');
});

function money(v) {
    return Number(v || 0).toFixed(2);
}

function orcBadge(status) {
    if (status === 'pendente') return '<span class="badge badge-orange">Pendente</span>';
    if (status === 'aprovado') return '<span class="badge badge-green">Aprovado</span>';
    return '<span class="badge badge-red">Rejeitado</span>';
}

async function decidir(orcamentoId, decisao) {
    try {
        const data = await Api.post(`/api/orcamentos/${orcamentoId}/decidir`, { decisao });
        showFlash(data.mensagem || 'Decisão registrada.', 'success');
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

async function load() {
    try {
        const q = filtroStatus ? '?status=' + encodeURIComponent(filtroStatus) : '';
        const data = await Api.get('/api/orcamentos' + q);
        const orcamentos = data.orcamentos || [];
        const container = document.getElementById('lista-container');

        if (!orcamentos.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.wallet(48)}</div>
                    <h3>Nenhum orçamento encontrado</h3>
                    <p>Orçamentos enviados pelas oficinas vinculadas às ocorrências aparecem aqui.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ocorrência</th>
                            <th>Veículo</th>
                            <th>Oficina</th>
                            <th>Problema</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Enviado em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    ${orcamentos.map(o => `
                        <tr>
                            <td style="font-weight:700;color:var(--gray-400)">#${o.id}</td>
                            <td><a href="detalhe_ocorrencia.html?id=${o.ocorrencia_id}">#${o.ocorrencia_id}</a></td>
                            <td>${o.veiculo_placa || '—'}</td>
                            <td>${o.oficina_nome || '—'}</td>
                            <td style="text-transform:capitalize">${o.tipo_problema || '—'}</td>
                            <td style="font-weight:700">R$ ${money(o.total)}</td>
                            <td>${orcBadge(o.status)}</td>
                            <td style="font-size:13px;color:var(--gray-600)">${formatDate(o.data_envio)}</td>
                            <td>
                                ${o.status === 'pendente' ? `
                                <div style="display:flex;gap:6px">
                                    <button type="button" class="btn btn-primary btn-sm" data-aprovar="${o.id}">Aprovar</button>
                                    <button type="button" class="btn btn-danger btn-sm" data-rejeitar="${o.id}">Rejeitar</button>
                                </div>` : `
                                <a href="detalhe_ocorrencia.html?id=${o.ocorrencia_id}" class="btn btn-outline btn-sm">Ver</a>`}
                            </td>
                        </tr>
                    `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        container.querySelectorAll('[data-aprovar]').forEach(btn => {
            btn.addEventListener('click', () => decidir(btn.dataset.aprovar, 'aprovar'));
        });
        container.querySelectorAll('[data-rejeitar]').forEach(btn => {
            btn.addEventListener('click', () => decidir(btn.dataset.rejeitar, 'rejeitar'));
        });
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

load();
</script>
</body>
</html>
