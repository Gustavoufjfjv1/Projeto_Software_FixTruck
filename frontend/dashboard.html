<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Dashboard</h1>
        <p id="empresa-sub">Visão geral da operação</p>
    </div>
    <a href="nova_ocorrencia.html" class="btn btn-primary">Nova Ocorrência</a>
</div>

<div class="stats-grid" id="stats-grid"></div>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Ocorrências em aberto</span>
            <a href="ocorrencias.html?status=abertas" class="btn btn-outline btn-sm">Ver todas</a>
        </div>
        <div id="abertas-container"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
            <div class="card-header"><span class="card-title">Ação Rápida</span></div>
            <a href="nova_ocorrencia.html" class="btn btn-primary btn-full" style="margin-bottom:10px">Registrar Ocorrência</a>
            <a href="frota.html" class="btn btn-outline btn-full" style="margin-bottom:10px">Vincular Motorista / Frota</a>
            <a href="ocorrencias.html?status=resolvido" class="btn btn-outline btn-full">Histórico Encerrado</a>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title">Recentes</span></div>
            <div id="recentes-container"></div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('dashboard');

(async () => {
    const empresa = Api.getEmpresa();
    if (empresa && empresa.nome) {
        document.getElementById('empresa-sub').textContent = `Visão geral da operação de ${empresa.nome}`;
    }

    try {
        const data = await Api.get('/api/dashboard');

        document.getElementById('stats-grid').innerHTML = `
            <a href="ocorrencias.html?status=abertas" class="stat-card red" style="text-decoration:none;color:inherit">
                <div class="stat-label">Ocorrências em Aberto</div>
                <div class="stat-value">${data.ocorrencias_abertas}</div>
                <div class="stat-sub">necessitam atenção</div>
            </a>
            <a href="ocorrencias.html?status=resolvido" class="stat-card" style="text-decoration:none;color:inherit">
                <div class="stat-label">Histórico Encerrado</div>
                <div class="stat-value">${data.total_ocorrencias}</div>
                <div class="stat-sub">total de ocorrências</div>
            </a>
            <div class="stat-card blue">
                <div class="stat-label">Problema Mais Comum</div>
                <div class="stat-value" style="font-size:18px;padding-top:6px;text-transform:capitalize">${data.problema_comum || '-'}</div>
                <div class="stat-sub">com base no histórico</div>
            </div>
            <a href="relatorios.html" class="stat-card orange" style="text-decoration:none;color:inherit">
                <div class="stat-label">Tempo até Encontrar Oficina</div>
                <div class="stat-value">${data.tempo_medio_oficina || 0}<span style="font-size:16px;font-weight:400"> min</span></div>
                <div class="stat-sub">média da abertura até vincular oficina</div>
            </a>
            <a href="frota.html" class="stat-card" style="text-decoration:none;color:inherit">
                <div class="stat-label">Caminhões Atendidos</div>
                <div class="stat-value">${data.veiculos_atendidos || 0}</div>
                <div class="stat-sub">veículos distintos com ocorrência</div>
            </a>
        `;

        const abertas = data.abertas_list || [];
        const abertasEl = document.getElementById('abertas-container');
        if (abertas.length) {
            abertasEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th><th>Veículo</th><th>Problema</th><th>Status</th><th>Data</th><th></th>
                            </tr>
                        </thead>
                        <tbody>
                        ${abertas.map(oc => `
                            <tr>
                                <td style="font-weight:700;color:var(--gray-400)">#${oc.id}</td>
                                <td>
                                    ${esc(oc.veiculo_placa || oc.tipo_veiculo || '—')}
                                    ${oc.pane_total ? '<span class="badge badge-red" style="margin-left:6px">pane total</span>' : ''}
                                </td>
                                <td style="text-transform:capitalize">${esc(oc.tipo_problema || '—')}</td>
                                <td>${statusBadge(oc.status)}</td>
                                <td style="color:var(--gray-400);font-size:13px">${formatDate(oc.data_abertura)}</td>
                                <td>
                                    <a href="detalhe_ocorrencia.html?id=${oc.id}" class="btn btn-outline btn-sm">Ver</a>
                                </td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } else {
            abertasEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.check(48)}</div>
                    <h3>Nenhuma ocorrência em aberto</h3>
                    <p>Todas as ocorrências foram resolvidas.</p>
                </div>
            `;
        }

        const recentes = (data.recentes || []).slice(0, 3);
        const recentesEl = document.getElementById('recentes-container');
        if (recentes.length) {
            recentesEl.innerHTML = recentes.map(oc => `
                <div class="info-row">
                    <span class="info-label">#${oc.id} · ${esc(oc.tipo_problema || '')}</span>
                    <span class="info-value" style="font-size:12px;text-transform:capitalize">${oc.status || ''}</span>
                </div>
            `).join('');
        } else {
            recentesEl.innerHTML = `<p style="color:var(--gray-400);font-size:13px">Sem ocorrências recentes.</p>`;
        }
    } catch (err) {
        showFlash(err.message, 'error');
    }
})();
</script>
</body>
</html>
