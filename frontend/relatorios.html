<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Relatórios</h1>
        <p>Indicadores de desempenho operacional</p>
    </div>
</div>

<div id="stats-grid" class="stats-grid" style="margin-bottom:28px"></div>
<div id="charts" class="charts-grid"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('relatorios');

function barRows(rows, labelKey, blue) {
    if (!rows.length) {
        return `<div class="empty-state" style="padding:30px">
            <div class="empty-icon">${Icons.chart(32)}</div>
            <p>Nenhum dado disponível</p>
        </div>`;
    }
    const max = Math.max(...rows.map(r => Number(r.c) || 0), 1);
    return `<div class="bar-chart">
        ${rows.map(row => {
            const pct = Math.trunc((Number(row.c) / max) * 100);
            return `
            <div class="bar-row">
                <div class="bar-label" style="text-transform:capitalize">${row[labelKey] || '—'}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%;${blue ? 'background:var(--blue)' : ''}"></div>
                </div>
                <div class="bar-value">${row.c}</div>
            </div>`;
        }).join('')}
    </div>`;
}

(async () => {
    try {
        const data = await Api.get('/api/relatorios');
        const total = data.total || 0;
        const abertas = data.abertas || 0;
        const emAtend = data.em_atendimento || 0;
        const encerradas = data.encerradas || 0;
        const tempo = data.tempo_medio || 0;
        const porTipo = data.por_tipo || [];
        const porVeiculo = data.por_veiculo || [];
        const porMes = data.por_mes || [];

        document.getElementById('stats-grid').innerHTML = `
            <div class="stat-card">
                <div class="stat-label">Total de Ocorrências</div>
                <div class="stat-value">${total}</div>
            </div>
            <div class="stat-card red">
                <div class="stat-label">Em Aberto</div>
                <div class="stat-value">${abertas}</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-label">Em Atendimento</div>
                <div class="stat-value">${emAtend}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Resolvidas</div>
                <div class="stat-value">${encerradas}</div>
                <div class="stat-sub">tempo médio ${tempo} min</div>
            </div>
        `;

        const maxMes = Math.max(...porMes.map(r => Number(r.c) || 0), 1);
        const mesHtml = porMes.length
            ? `<div style="display:flex;align-items:flex-end;gap:16px;height:160px;padding:10px 0">
                ${[...porMes].reverse().map(row => `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
                        <span style="font-size:13px;font-weight:700;color:var(--gray-700)">${row.c}</span>
                        <div style="width:100%;background:var(--green);border-radius:6px 6px 0 0;height:${Math.max(6, Math.trunc((Number(row.c) / maxMes) * 120))}px;min-height:6px;transition:height 1s ease"></div>
                        <span style="font-size:11px;color:var(--gray-400)">${row.mes}</span>
                    </div>
                `).join('')}
               </div>`
            : `<div class="empty-state" style="padding:30px">
                <div class="empty-icon">${Icons.calendar(32)}</div>
                <p>Nenhum dado disponível por mês</p>
               </div>`;

        document.getElementById('charts').innerHTML = `
            <div class="card">
                <div class="card-header"><span class="card-title">Ocorrências por Tipo de Problema</span></div>
                ${barRows(porTipo, 'tipo_problema', false)}
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Ocorrências por Tipo de Veículo</span></div>
                ${barRows(porVeiculo.map(r => ({ ...r, label: r.veiculo || r.tipo_veiculo })), 'label', true)}
            </div>

            <div class="card" style="grid-column:1/-1">
                <div class="card-header"><span class="card-title">Ocorrências por Mês</span></div>
                ${mesHtml}
            </div>

            <div class="card" style="grid-column:1/-1">
                <div class="card-header">
                    <span class="card-title">Resumo Executivo</span>
                </div>
                <div class="grid-3">
                    <div style="text-align:center;padding:20px;background:var(--gray-50);border-radius:var(--radius-sm)">
                        <div class="empty-icon" style="margin-bottom:8px">${Icons.clipboard(36)}</div>
                        <div style="font-family:var(--display);font-size:28px;font-weight:700;color:var(--gray-900)">${total}</div>
                        <div style="font-size:13px;color:var(--gray-500)">Ocorrências totais</div>
                    </div>
                    <div style="text-align:center;padding:20px;background:var(--gray-50);border-radius:var(--radius-sm)">
                        <div class="empty-icon" style="margin-bottom:8px">${Icons.clock(36)}</div>
                        <div style="font-family:var(--display);font-size:28px;font-weight:700;color:var(--orange)">${tempo}<span style="font-size:14px;font-weight:400">min</span></div>
                        <div style="font-size:13px;color:var(--gray-500)">Tempo médio parado</div>
                    </div>
                    <div style="text-align:center;padding:20px;background:var(--gray-50);border-radius:var(--radius-sm)">
                        <div class="empty-icon" style="margin-bottom:8px">${Icons.check(36)}</div>
                        <div style="font-family:var(--display);font-size:28px;font-weight:700;color:var(--green)">${encerradas}</div>
                        <div style="font-size:13px;color:var(--gray-500)">Ocorrências encerradas</div>
                    </div>
                </div>
            </div>
        `;

        document.querySelectorAll('.bar-fill').forEach((bar) => {
            const w = bar.style.width;
            bar.style.width = '0';
            setTimeout(() => { bar.style.width = w; }, 100);
        });
    } catch (err) {
        showFlash(err.message, 'error');
    }
})();
</script>
</body>
</html>
