<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encerrar Ocorrência — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-root"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

const id = qs('id');
const oficinaPre = qs('oficina_id') || '';
if (!id) {
    window.location.href = 'ocorrencias.html';
    throw new Error('id');
}

(async () => {
    try {
        const data = await Api.get(`/api/ocorrencias/${id}`);
        const oc = data.ocorrencia;

        document.title = `Encerrar Ocorrência — FixTruck`;

        if (oc.status === 'resolvido') {
            document.getElementById('page-root').innerHTML = `
                <div class="page-header">
                    <div><h1>Ocorrência #${oc.id} já resolvida</h1></div>
                    <a href="ocorrencias.html" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
                </div>
                <div class="card" style="max-width:600px">
                    <div class="alert alert-texto alert-info">
                        Esta ocorrência já foi encerrada em ${formatDate(oc.data_encerramento)},
                        com a oficina <strong>${esc(oc.oficina_nome || '—')}</strong>. Não é possível encerrá-la novamente.
                    </div>
                    <a href="detalhe_ocorrencia.html?id=${id}" class="btn btn-primary btn-full">Ver detalhes da ocorrência</a>
                </div>
            `;
            hydrateIcons();
            return;
        }

        document.getElementById('page-root').innerHTML = `
            <div class="page-header">
                <div>
                    <h1>Encerrar Ocorrência #${oc.id}</h1>
                    <p>Altere o status da ocorrência ativa para <strong>resolvido</strong></p>
                </div>
                <a href="${voltarPara('ocorrencias.html')}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>

            <div class="grid-2" style="max-width:900px">
                <div class="card">
                    <div class="card-header"><span class="card-title">Dados da Ocorrência</span></div>
                    <div class="info-row"><span class="info-label">Tipo de veículo</span><span class="info-value" style="text-transform:capitalize">${oc.tipo_veiculo || '—'}</span></div>
                    <div class="info-row"><span class="info-label">Tipo de problema</span><span class="info-value" style="text-transform:capitalize">${esc(oc.tipo_problema || '—')}</span></div>
                    <div class="info-row"><span class="info-label">Pane total</span><span class="info-value">${oc.pane_total ? 'Sim' : 'Não'}</span></div>
                    <div class="info-row"><span class="info-label">Local</span><span class="info-value" style="font-size:13px">${esc(oc.endereco || '—')}</span></div>
                    <div class="info-row"><span class="info-label">Abertura</span><span class="info-value" style="font-size:13px">${formatDate(oc.data_abertura)}</span></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">Registro de Encerramento</span></div>

                    <div class="alert alert-texto alert-warning" style="margin-bottom:16px">
                        ${Icons.alert(16)} Selecionar uma oficina é <strong>obrigatório</strong> para encerrar a ocorrência.
                    </div>

                    <form id="encerrarForm">
                        <div class="form-group">
                            <label for="buscar-oficina">Buscar oficina por nome</label>
                            <input type="search" id="buscar-oficina" placeholder="Digite pelo menos 3 caracteres..." autocomplete="off">
                            <small id="resultado-busca-oficina" style="display:block;margin-top:6px;color:var(--gray-500)">Digite ao menos 3 caracteres para pesquisar.</small>
                        </div>
                        <div class="form-group">
                            <label for="oficina_id">Oficina Utilizada *</label>
                            <select name="oficina_id" id="oficina_id" required>
                                <option value="">Selecione a oficina...</option>
                                ${oficinas.map(of => {
                                    const sel = String(oficinaPre || oc.oficina_id || '') === String(of.id) ? 'selected' : '';
                                    return `<option value="${of.id}" ${sel}>${esc(of.nome)} — ${esc(of.endereco || '')}</option>`;
                                }).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Motivo da Resolução *</label>
                            <select name="motivo" id="motivo" required>
                                <option value="">Selecione...</option>
                                <option value="Problema resolvido na oficina">Resolvido na oficina</option>
                                <option value="Troca de peça">Troca de peça</option>
                                <option value="Reparo no local">Reparo no local</option>
                                <option value="Rebocado até a base">Rebocado até a base</option>
                                <option value="Falso alarme">Falso alarme</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Observações (opcional)</label>
                            <textarea name="observacoes" id="observacoes" maxlength="1000" placeholder="Descreva o que foi feito, peças trocadas, valor pago, etc..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">Confirmar — status resolvido</button>
                    </form>
                </div>
            </div>
        `;

        hydrateIcons();
        const oficinaSelect = document.getElementById('oficina_id');
        const campoBusca = document.getElementById('buscar-oficina');
        const resultadoBusca = document.getElementById('resultado-busca-oficina');

        if (oc.oficina_id) {
            const option = new Option(
                `${oc.oficina_nome || 'Oficina já vinculada'} (já selecionada)`,
                oc.oficina_id,
                true,
                true
            );
            oficinaSelect.add(option);
        }

        if (oficinaPre && String(oficinaPre) !== String(oc.oficina_id || '')) {
            try {
                const selecionada = await Api.get(`/api/oficinas/${encodeURIComponent(oficinaPre)}`);
                const oficina = selecionada.oficina;
                oficinaSelect.add(new Option(
                    `${oficina.nome} — ${oficina.endereco || ''}`,
                    oficina.id,
                    true,
                    true
                ));
            } catch (err) {
                showFlash(`Não foi possível carregar a oficina selecionada: ${err.message}`, 'error');
            }
        }

        let buscaAtual = 0;
        let temporizadorBusca;
        campoBusca.addEventListener('input', () => {
            window.clearTimeout(temporizadorBusca);
            const termo = campoBusca.value.trim();
            const requisicao = ++buscaAtual;
            if (termo.length < 3) {
                resultadoBusca.textContent = 'Digite ao menos 3 caracteres para pesquisar.';
                Array.from(oficinaSelect.options).slice(1).forEach(option => {
                    if (option.value !== String(oficinaSelect.value)) option.remove();
                });
                return;
            }

            resultadoBusca.textContent = 'Pesquisando oficinas...';
            temporizadorBusca = window.setTimeout(async () => {
                try {
                    const query = new URLSearchParams({
                        busca: termo,
                        limite: '30',
                        campo: 'nome',
                    });
                    const resultado = await Api.get(`/api/oficinas?${query}`);
                    if (requisicao !== buscaAtual) return;

                    const oficinaAtual = Array.from(oficinaSelect.options)
                        .find(option => option.value === String(oficinaSelect.value));
                    oficinaSelect.replaceChildren(new Option('Selecione a oficina...', ''));
                    if (oficinaAtual && oficinaAtual.value) oficinaSelect.add(oficinaAtual);

                    const oficinas = resultado.oficinas || [];
                    oficinas.forEach(oficina => {
                        if (oficina.id === Number(oficinaSelect.value)) return;
                        oficinaSelect.add(new Option(
                            `${oficina.nome} — ${oficina.endereco || ''}`,
                            oficina.id
                        ));
                    });
                    resultadoBusca.textContent = oficinas.length
                        ? `${oficinas.length} resultado(s). Selecione a oficina desejada.`
                        : 'Nenhuma oficina encontrada. Tente outro nome.';
                    oficinaSelect.value = oficinaAtual ? oficinaAtual.value : '';
                } catch (err) {
                    if (requisicao === buscaAtual) {
                        resultadoBusca.textContent = `Erro ao pesquisar oficinas: ${err.message}`;
                    }
                }
            }, 300);
        });

        document.getElementById('encerrarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await Api.post(`/api/ocorrencias/${id}/encerrar`, {
                    oficina_id: Number(document.getElementById('oficina_id').value),
                    motivo: document.getElementById('motivo').value,
                    observacoes: document.getElementById('observacoes').value,
                });
                showFlash(res.mensagem || 'Ocorrência encerrada.', 'success');
                window.location.href = `detalhe_ocorrencia.html?id=${id}`;
            } catch (err) {
                showFlash(err.message, 'error');
            }
        });
    } catch (err) {
        showFlash(err.message, 'error');
        document.getElementById('page-root').innerHTML = `
            <div class="page-header">
                <div><h1>Encerrar Ocorrência</h1></div>
                <a href="${voltarPara('ocorrencias.html')}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>
        `;
    }
})();
</script>
</body>
</html>
