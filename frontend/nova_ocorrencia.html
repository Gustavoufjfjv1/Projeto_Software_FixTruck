<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ocorrência — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-page-center">
    <div class="page-header">
        <div>
            <h1>Nova Ocorrência</h1>
            <p>Registro pelo gestor: informe o problema mecânico e o local da ocorrência</p>
        </div>
        <a href="ocorrencias.html" id="btnVoltar" class="btn btn-outline"><span data-icon="arrowLeft" data-size="16"></span> Voltar</a>
    </div>

    <div class="card">
        <div class="card-header"><span class="card-title">Dados da Ocorrência</span></div>

        <div class="alert alert-info">
            Informe onde o veículo está (rodovia/avenida, KM e cidade) ou use o GPS. Pelo menos uma das opções é necessária.
        </div>
        <div id="form-erros"></div>

        <form id="ocForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="veiculo_id">Veículo da frota *</label>
                    <select id="veiculo_id" required>
                        <option value="">Selecione o veículo...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="motorista_id">Motorista</label>
                    <select id="motorista_id">
                        <option value="">Vinculado ao veículo</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="tipo_problema">Tipo de problema mecânico *</label>
                <select id="tipo_problema" required></select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição (opcional)</label>
                <textarea id="descricao" maxlength="500" placeholder="O que aconteceu? Ex.: barulho no motor e perda de força"></textarea>
            </div>

            <div class="form-group">
                <label>Pane Total?</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="pane_total" value="1">
                    Sim — o veículo não anda (só serão recomendadas oficinas com guincho)
                </label>
            </div>

            <div id="local-container"></div>

            <div style="display:flex;gap:12px;margin-top:8px">
                <button type="submit" class="btn btn-primary" style="flex:1" id="submitBtn">
                    Abrir Ocorrência e Buscar Oficinas <span data-icon="arrowRight" data-size="16"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/geo.js"></script>
<script src="js/localizacao.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

document.getElementById('btnVoltar').href = voltarPara('ocorrencias.html');
document.getElementById('local-container').innerHTML = Localizacao.html();
Localizacao.ligar();

function mostrarErro(msg) {
    document.getElementById('form-erros').innerHTML = msg ? `<div class="alert alert-warning">${esc(msg)}</div>` : '';
    if (msg) showFlash(msg, 'error');
}

document.getElementById('veiculo_id').addEventListener('change', () => {
    const opt = document.getElementById('veiculo_id').selectedOptions[0];
    if (opt && opt.dataset.motorista) document.getElementById('motorista_id').value = opt.dataset.motorista;
});

document.getElementById('ocForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    mostrarErro('');
    if (!document.getElementById('veiculo_id').value) return mostrarErro('Selecione o veículo da frota.');
    if (!document.getElementById('tipo_problema').value) return mostrarErro('Selecione o tipo de problema.');
    const local = await Localizacao.coletar();
    if (local.erro) return mostrarErro(local.erro);

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
        const res = await Api.post('/api/ocorrencias', {
            veiculo_id: document.getElementById('veiculo_id').value || null,
            motorista_id: document.getElementById('motorista_id').value || null,
            tipo_problema: document.getElementById('tipo_problema').value,
            descricao: document.getElementById('descricao').value,
            pane_total: document.getElementById('pane_total').checked,
            ...local.dados,
        });
        showFlash(res.mensagem || 'Ocorrência registrada.', 'success');
        window.location.href = `buscar_oficinas.html?id=${res.id}`;
    } catch (err) {
        mostrarErro(err.message);
        btn.disabled = false;
    }
});

(async () => {
    try {
        const [opcoes, data] = await Promise.all([carregarOpcoes(), Api.get('/api/ocorrencias/form-data')]);
        document.getElementById('tipo_problema').innerHTML = optionsHtml(opcoes.tipos_problema, '', 'Selecione...');
        const veiculos = data.veiculos || [];
        const motoristas = data.motoristas || [];
        document.getElementById('veiculo_id').innerHTML =
            '<option value="">Selecione o veículo...</option>' +
            veiculos.map(v =>
                `<option value="${v.id}" data-motorista="${v.motorista_id || ''}">${esc(v.placa)} — ${esc(v.modelo || v.tipo_veiculo)}${v.motorista_nome ? ' (' + esc(v.motorista_nome) + ')' : ''}</option>`
            ).join('');
        document.getElementById('motorista_id').innerHTML =
            '<option value="">Vinculado ao veículo</option>' +
            motoristas.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join('');
        hydrateIcons();
    } catch (err) {
        showFlash(err.message, 'error');
    }
})();
</script>
</body>
</html>
