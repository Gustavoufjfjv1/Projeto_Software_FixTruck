<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ocorrência — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-page-center" id="page-root"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="js/geo.js"></script>
<script src="js/localizacao.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

const id = qs('id');
if (!id) {
    window.location.href = 'ocorrencias.html';
    throw new Error('id');
}

function mostrarErro(msg) {
    document.getElementById('form-erros').innerHTML = msg ? `<div class="alert alert-warning">${esc(msg)}</div>` : '';
    if (msg) showFlash(msg, 'error');
}

async function carregar() {
    const root = document.getElementById('page-root');
    try {
        const [detalhe, formData, opcoes] = await Promise.all([
            Api.get(`/api/ocorrencias/${id}`),
            Api.get('/api/ocorrencias/form-data'),
            carregarOpcoes(),
        ]);
        const oc = detalhe.ocorrencia;
        const veiculos = formData.veiculos || [];
        const motoristas = formData.motoristas || [];

        if (oc.status === 'resolvido') {
            root.innerHTML = `
                <div class="page-header">
                    <div><h1>Ocorrência #${oc.id} já resolvida</h1></div>
                    <a href="detalhe_ocorrencia.html?id=${id}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
                </div>
                <div class="card" style="max-width:600px">
                    <div class="alert alert-texto alert-info">
                        Ocorrências já resolvidas ficam bloqueadas para edição, para preservar o histórico.
                    </div>
                    <a href="detalhe_ocorrencia.html?id=${id}" class="btn btn-primary btn-full">Ver detalhes da ocorrência</a>
                </div>
            `;
            return;
        }

        const partes = Localizacao.separarEndereco(oc.endereco);
        const avisoVinculo = oc.status === 'em_atendimento' ? `
            <div class="alert alert-texto alert-warning" style="margin-bottom:16px">
                Esta ocorrência já está vinculada à oficina <strong>${esc(oc.oficina_nome || '—')}</strong>.
                Se você mudar o tipo de problema ou o veículo, busque oficinas novamente
                para confirmar que ela ainda é compatível.
            </div>
        ` : '';

        root.innerHTML = `
            <div class="page-header">
                <div>
                    <h1>Editar Ocorrência #${oc.id}</h1>
                    <p>Corrija os dados registrados enquanto a ocorrência ainda não foi resolvida</p>
                </div>
                <a href="detalhe_ocorrencia.html?id=${id}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Dados da Ocorrência</span></div>
                ${avisoVinculo}
                <div id="form-erros"></div>

                <form id="ocForm" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="veiculo_id">Veículo da frota *</label>
                            <select id="veiculo_id" required>
                                <option value="">Selecione o veículo...</option>
                                ${veiculos.map(v => `<option value="${v.id}" data-motorista="${v.motorista_id || ''}" ${String(oc.veiculo_id) === String(v.id) ? 'selected' : ''}>${esc(v.placa)} — ${esc(v.modelo || v.tipo_veiculo)}${v.motorista_nome ? ' (' + esc(v.motorista_nome) + ')' : ''}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="motorista_id">Motorista</label>
                            <select id="motorista_id">
                                <option value="">Vinculado ao veículo</option>
                                ${motoristas.map(m => `<option value="${m.id}" ${String(oc.motorista_id) === String(m.id) ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tipo_problema">Tipo de problema mecânico *</label>
                        <select id="tipo_problema" required>${optionsHtml(opcoes.tipos_problema, oc.tipo_problema, 'Selecione...')}</select>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição (opcional)</label>
                        <textarea id="descricao" maxlength="500">${esc(oc.descricao || '')}</textarea>
                    </div>

                    <div class="form-group">
                        <label>Pane Total?</label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="pane_total" value="1" ${oc.pane_total ? 'checked' : ''}>
                            Sim — o veículo não anda (só serão recomendadas oficinas com guincho)
                        </label>
                    </div>

                    ${Localizacao.html({ ...partes, lat: oc.lat, lon: oc.lon })}

                    <div style="display:flex;gap:12px;margin-top:8px">
                        <button type="submit" class="btn btn-primary" style="flex:1" id="submitBtn">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        `;
        ligarFormulario();
    } catch (err) {
        showFlash(err.message, 'error');
        root.innerHTML = `
            <div class="page-header">
                <div><h1>Editar Ocorrência</h1><p>Não foi possível carregar.</p></div>
                <a href="detalhe_ocorrencia.html?id=${id}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>
        `;
    }
}

function ligarFormulario() {
    Localizacao.ligar();
    document.getElementById('veiculo_id').addEventListener('change', () => {
        const opt = document.getElementById('veiculo_id').selectedOptions[0];
        if (opt && opt.dataset.motorista) document.getElementById('motorista_id').value = opt.dataset.motorista;
    });

    document.getElementById('ocForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        mostrarErro('');
        if (!document.getElementById('veiculo_id').value) return mostrarErro('Selecione o veículo da frota.');
        if (!document.getElementById('tipo_problema').value) return mostrarErro('Selecione o tipo de problema.');
        const local = await Localizacao.coletar();
        if (local.erro) return mostrarErro(local.erro);
        try {
            const res = await Api.put(`/api/ocorrencias/${id}`, {
                veiculo_id: document.getElementById('veiculo_id').value || null,
                motorista_id: document.getElementById('motorista_id').value || null,
                tipo_problema: document.getElementById('tipo_problema').value,
                descricao: document.getElementById('descricao').value,
                pane_total: document.getElementById('pane_total').checked,
                ...local.dados,
            });
            showFlash(res.mensagem || 'Ocorrência atualizada.', 'success');
            window.location.href = `detalhe_ocorrencia.html?id=${id}`;
        } catch (err) {
            mostrarErro(err.message);
        }
    });
}

carregar();
</script>
</body>
</html>
