<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrência — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page-root"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

const id = qs('id');
if (!id) {
    window.location.href = 'ocorrencias.html';
    throw new Error('id');
}

async function load() {
    try {
        const data = await Api.get(`/api/ocorrencias/${id}`);
        const oc = data.ocorrencia;

        document.title = `Ocorrência #${oc.id} — FixTruck`;

        const headerActions = oc.status !== 'resolvido'
            ? `<a href="editar_ocorrencia.html?id=${oc.id}" class="btn btn-outline">${Icons.edit(16)} Editar</a>
               <a href="buscar_oficinas.html?id=${oc.id}" class="btn btn-outline">Buscar oficinas</a>
               <a href="encerrar_ocorrencia.html?id=${oc.id}" class="btn btn-primary">Encerrar (resolvido)</a>`
            : '';

        document.getElementById('page-root').innerHTML = `
            <div class="page-header">
                <div>
                    <h1>Ocorrência #${oc.id}</h1>
                    <p>${statusBadge(oc.status)}</p>
                </div>
                <div style="display:flex;gap:10px">
                    ${headerActions}
                    <a href="${voltarPara('ocorrencias.html')}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
                </div>
            </div>

            <div class="card" style="max-width:700px">
                <div class="card-header"><span class="card-title">Dados da ocorrência</span></div>
                <div class="info-row"><span class="info-label">Veículo</span><span class="info-value">${esc(oc.veiculo_placa || oc.tipo_veiculo || '—')}${esc(oc.veiculo_modelo ? ' — ' + oc.veiculo_modelo : '')}</span></div>
                <div class="info-row"><span class="info-label">Motorista</span><span class="info-value">${esc(oc.motorista_nome || '—')}</span></div>
                <div class="info-row"><span class="info-label">Registrada por</span><span class="info-value">${oc.registrada_por === 'motorista' ? '<span class="badge badge-blue">Motorista (acesso próprio)</span>' : 'Empresa (gestor)'}</span></div>
                <div class="info-row"><span class="info-label">Tipo de problema</span><span class="info-value" style="text-transform:capitalize">${esc(oc.tipo_problema || '—')}</span></div>
                ${oc.descricao ? `<div class="info-row"><span class="info-label">Descrição</span><span class="info-value" style="text-align:left;max-width:60%">${esc(oc.descricao)}</span></div>` : ''}
                <div class="info-row"><span class="info-label">Local</span><span class="info-value" style="font-size:13px">${esc(oc.endereco || '—')}</span></div>
                <div class="info-row"><span class="info-label">Pane total</span><span class="info-value">${oc.pane_total ? 'Sim' : 'Não'}</span></div>
                <div class="info-row"><span class="info-label">Localização GPS</span><span class="info-value" style="font-size:13px">${oc.lat && oc.lon ? oc.lat + ', ' + oc.lon : '—'}</span></div>
                <div class="info-row">
                    <span class="info-label">Oficina</span>
                    <span class="info-value" style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
                        ${esc(oc.oficina_nome || '—')}
                        ${oc.oficina_id ? `
                        <button type="button" class="fav-btn ${oc.oficina_favoritada ? 'active' : ''}" id="favOficinaBtn"
                                title="${oc.oficina_favoritada ? 'Remover dos favoritos' : 'Favoritar esta oficina'}">
                            ${oc.oficina_favoritada ? Icons.star(16, true) : Icons.star(16, false)}
                        </button>` : ''}
                    </span>
                </div>
                <div class="info-row"><span class="info-label">Abertura</span><span class="info-value" style="font-size:13px">${formatDate(oc.data_abertura)}</span></div>
                <div class="info-row"><span class="info-label">Encerramento</span><span class="info-value" style="font-size:13px">${formatDate(oc.data_encerramento)}</span></div>
                ${oc.tempo_ate_oficina_min != null ? `
                <div class="info-row"><span class="info-label">Tempo até encontrar oficina</span><span class="info-value">${oc.tempo_ate_oficina_min} min</span></div>
                ` : ''}
                ${oc.tempo_total_min != null ? `
                <div class="info-row"><span class="info-label">Tempo total do atendimento</span><span class="info-value">${oc.tempo_total_min} min</span></div>
                ` : ''}
                ${oc.motivo_resolucao ? `
                <div class="info-row"><span class="info-label">Motivo da resolução</span><span class="info-value">${esc(oc.motivo_resolucao)}</span></div>
                ` : ''}
                ${oc.observacoes ? `
                <div class="info-row"><span class="info-label">Observações</span><span class="info-value" style="text-align:left;max-width:60%">${esc(oc.observacoes)}</span></div>
                ` : ''}
            </div>
        `;

        hydrateIcons();
        const favBtn = document.getElementById('favOficinaBtn');
        if (favBtn) {
            favBtn.addEventListener('click', async () => {
                try {
                    const res = await Api.post(`/api/oficinas/${oc.oficina_id}/favoritar`);
                    showFlash(res.mensagem || 'Favorito atualizado.', 'success');
                    load();
                } catch (err) {
                    showFlash(err.message, 'error');
                }
            });
        }
    } catch (err) {
        showFlash(err.message, 'error');
        document.getElementById('page-root').innerHTML = `
            <div class="page-header">
                <div><h1>Ocorrência</h1><p>Não foi possível carregar.</p></div>
                <a href="${voltarPara('ocorrencias.html')}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>
        `;
    }
}

load();
</script>
</body>
</html>
