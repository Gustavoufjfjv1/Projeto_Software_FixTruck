<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficinas Compatíveis — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="page-root"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/busca_oficinas.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('ocorrencias');

const id = qs('id');
if (!id) {
    window.location.href = 'ocorrencias.html';
    throw new Error('id');
}

async function vincular(oficinaId) {
    try {
        const data = await Api.post(`/api/ocorrencias/${id}/vincular-oficina`, { oficina_id: Number(oficinaId) });
        showFlash(data.mensagem || 'Oficina vinculada.', 'success');
        window.location.href = `detalhe_ocorrencia.html?id=${id}`;
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

async function favoritar(oficinaId) {
    try {
        const data = await Api.post(`/api/oficinas/${oficinaId}/favoritar`);
        showFlash(data.mensagem || 'Favorito atualizado.', 'success');
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

async function load() {
    const params = new URLSearchParams();
    if (qs('raio')) params.set('raio', qs('raio'));
    if (qs('janela')) params.set('janela', qs('janela'));
    const q = params.toString();
    const root = document.getElementById('page-root');
    try {
        const data = await Api.get(`/api/ocorrencias/${id}/buscar-oficinas${q ? '?' + q : ''}`);
        BuscaOficinas.render(root, data, {
            podeSelecionar: data.ocorrencia.status !== 'resolvido',
            podeFavoritar: true,
            linkDetalhe: true,
            voltarHref: `detalhe_ocorrencia.html?id=${id}`,
            voltarTexto: 'Ocorrência',
            onVincular: vincular,
            onFavoritar: favoritar,
            onFiltro: ({ raio, janela }) => {
                const p = new URLSearchParams({ id });
                if (raio) p.set('raio', raio);
                if (janela && janela !== '0') p.set('janela', janela);
                window.location.href = `buscar_oficinas.html?${p.toString()}`;
            },
            rodape: `<div style="margin-top:24px;text-align:center">
                <a href="encerrar_ocorrencia.html?id=${id}" class="btn btn-outline">Encerrar ocorrência (status resolvido)</a></div>`,
        });
    } catch (err) {
        showFlash(err.message, 'error');
        root.innerHTML = `
            <div class="page-header">
                <div><h1>Oficinas compatíveis</h1></div>
                <a href="${voltarPara('ocorrencias.html')}" class="btn btn-outline">${Icons.arrowLeft(16)} Voltar</a>
            </div>`;
    }
}

load();
</script>
</body>
</html>
