<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficinas — FixTruck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-header">
    <div>
        <h1>Rede de Oficinas</h1>
        <p>Busque oficinas e filtre pelo raio de distância em quilômetros</p>
    </div>
</div>

<form id="buscaForm" class="card" style="margin-bottom:20px;padding:16px 20px">
    <div class="filters-bar" style="margin-bottom:0">
        <div class="search-input-wrap" style="max-width:320px">
            <span class="search-icon" data-icon="search"></span>
            <input type="text" name="busca" id="busca" placeholder="Nome ou especialidade..."
                   style="padding-left:36px;width:100%;padding-top:9px;padding-bottom:9px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;outline:none">
        </div>
        <select name="raio" id="raio" class="filter-select">
            <option value="">Raio (km)</option>
            <option value="5">Até 5 km</option>
            <option value="10">Até 10 km</option>
            <option value="20">Até 20 km</option>
            <option value="50">Até 50 km</option>
            <option value="100">Até 100 km</option>
        </select>
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lon" id="lon">
        <button type="button" class="btn btn-outline btn-sm" id="gpsBtn">Usar GPS</button>
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a href="oficinas.html" id="btn-limpar" class="btn btn-outline" style="display:none"><span data-icon="x" data-size="16"></span> Limpar</a>
    </div>
    <div id="gpsStatus" style="font-size:12px;color:var(--gray-400);margin-top:10px">
        Para filtrar por raio, use o GPS ou informe coordenadas.
    </div>
</form>

<div id="lista-container"></div>

<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
if (!Api.requireAuth()) throw new Error('auth');
renderLayout('oficinas');

const busca = qs('busca') || '';
const raio = qs('raio') || '';
const lat = qs('lat') || '';
const lon = qs('lon') || '';

document.getElementById('busca').value = busca;
document.getElementById('raio').value = raio;
document.getElementById('lat').value = lat;
document.getElementById('lon').value = lon;

if (busca || raio) document.getElementById('btn-limpar').style.display = '';
if (lat && lon) {
    document.getElementById('gpsStatus').textContent = `Referência GPS: ${lat}, ${lon}`;
}

function tagsEsp(especialidades) {
    return (especialidades || '').split(',').map(esp => {
        const t = esp.trim();
        return t ? `<span class="oficina-tag">${t}</span>` : '';
    }).join('');
}

async function favoritar(oficinaId) {
    try {
        const data = await Api.post(`/api/oficinas/${oficinaId}/favoritar`);
        showFlash(data.mensagem || 'Favorito atualizado.', 'success');
        load();
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

document.getElementById('gpsBtn').addEventListener('click', () => {
    const status = document.getElementById('gpsStatus');
    status.textContent = 'Obtendo localização GPS...';
    if (!navigator.geolocation) {
        status.textContent = 'Geolocalização não suportada.';
        return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('lon').value = pos.coords.longitude.toFixed(6);
        status.textContent = 'GPS capturado. Clique em Buscar para filtrar por raio.';
        document.getElementById('buscaForm').requestSubmit();
    }, () => {
        status.textContent = 'Não foi possível obter o GPS.';
    });
});

document.getElementById('buscaForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const params = new URLSearchParams();
    const b = document.getElementById('busca').value.trim();
    const r = document.getElementById('raio').value;
    const la = document.getElementById('lat').value;
    const lo = document.getElementById('lon').value;
    if (b) params.set('busca', b);
    if (r) params.set('raio', r);
    if (la) params.set('lat', la);
    if (lo) params.set('lon', lo);
    const q = params.toString();
    window.location.href = 'oficinas.html' + (q ? '?' + q : '');
});

async function load() {
    try {
        const params = new URLSearchParams();
        if (busca) params.set('busca', busca);
        if (raio) params.set('raio', raio);
        if (lat) params.set('lat', lat);
        if (lon) params.set('lon', lon);
        const q = params.toString();
        const data = await Api.get('/api/oficinas' + (q ? '?' + q : ''));
        const oficinas = data.oficinas || [];
        const container = document.getElementById('lista-container');

        if (!oficinas.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">${Icons.wrench(48)}</div>
                    <h3>Nenhuma oficina encontrada</h3>
                    <p>Ajuste a busca ou aumente o raio em quilômetros.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="oficinas-grid">
            ${oficinas.map(of => `
                <div class="oficina-card">
                    ${of.tem_guincho ? `
                    <div style="position:absolute;top:14px;right:14px">
                        <span class="guincho-badge">Guincho</span>
                    </div>` : ''}
                    <div class="oficina-card-header">
                        <div>
                            <div class="oficina-name">${of.nome}</div>
                            <div class="oficina-sub">${of.endereco || ''}</div>
                        </div>
                    </div>
                    <div class="oficina-tags">${tagsEsp(of.especialidades)}</div>
                    <div class="oficina-meta">
                        ${of.distancia != null ? `<span>${of.distancia} km</span>` : ''}
                        <span>
                            ${of.aberta_agora
                                ? '<span style="color:var(--green);font-weight:600">● Aberta agora</span>'
                                : '<span style="color:var(--gray-400)">● Fechada</span>'}
                        </span>
                        <span>Horário: ${of.hora_abertura || ''}–${of.hora_fechamento || ''}</span>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:var(--gray-500)">
                        Veículos: <strong>${of.tipos_veiculo || '—'}</strong>
                    </div>
                    <div class="oficina-actions">
                        <a href="detalhe_oficina.html?id=${of.id}" class="btn btn-outline btn-sm" style="flex:1;justify-content:center">Ver detalhes</a>
                        <button type="button" class="fav-btn ${of.favoritada ? 'active' : ''}" data-fav="${of.id}" title="Favoritar">
                            ${of.favoritada ? Icons.star(18, true) : Icons.star(18, false)}
                        </button>
                    </div>
                </div>
            `).join('')}
            </div>
        `;

        container.querySelectorAll('[data-fav]').forEach(btn => {
            btn.addEventListener('click', () => favoritar(btn.dataset.fav));
        });
    } catch (err) {
        showFlash(err.message, 'error');
    }
}

load();
</script>
</body>
</html>
